  if((m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/)))return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');

  var c2={tgl:find(function(x){return x==='Tanggal'}),sup:find(function(x){return /^Nama Pemasok/.test(x)}),kode:find(function(x){return /^Kode/.test(x)}),
    nama:find(function(x){return x==='Nama Barang'||x==='Barang & Jasa'||x==='Barang&Jasa'}),cab:find(function(x){return x==='Nama Cabang'}),qty:find(function(x){return /^Kuantitas/.test(x)}),rp:find(function(x){return x==='Penjualan'})};

    var s1=cellText(r[c2.sup]);if(s1)sp=s1;

function readFile(f){

function ingest(files){
  toast('Membaca '+files.length+' file...');
  Promise.all(files.map(function(f){return readFile(f).then(function(p){return {ok:true,p:p}},function(e){return {ok:false,name:f.name,err:e.message||String(e)}})})).then(function(res){
    var bad=res.filter(function(x){return !x.ok}),good=res.filter(function(x){return x.ok}).map(function(x){return x.p});
    if(!good.length){toast('Tidak ada file yang bisa dibaca. '+(bad[0]?bad[0].name+': '+bad[0].err:''));return}
    var base=isSample?{meta:{},files:[],inv:[],sales:[]}:store;
    var invBy=new Map();base.inv.forEach(function(r){if(!invBy.has(r.cab))invBy.set(r.cab,[]);invBy.get(r.cab).push(r)});
    var sales=base.sales,meta=Object.assign({},base.meta),files=base.files.slice(),sf=good.filter(function(p){return p.kind==='sales'});
    good.forEach(function(p){
      if(p.kind==='umur'){invBy.set(p.cab,p.rows);files=files.filter(function(x){return !(x.type==='umur'&&x.cab===p.cab)});files.push({type:'umur',name:p.fname,cab:p.cab});if(p.asof&&(!meta.asof||p.asof>meta.asof))meta.asof=p.asof}
    });
    if(sf.length){
      var m2=new Map();
      sf.forEach(function(p){p.rows.forEach(function(r){var k=r.kode+'\u0001'+r.cab,e=m2.get(k);if(!e)m2.set(k,Object.assign({},r));else{e.qty+=r.qty;e.rp+=r.rp}})});
      sales=Array.from(m2.values());
      meta.from=sf.map(function(p){return p.from}).filter(Boolean).sort()[0];meta.to=sf.map(function(p){return p.to}).filter(Boolean).sort().slice(-1)[0];
      var hs=new Set();sf.forEach(function(p){p.hdr.forEach(function(x){hs.add(x)})});meta.hdr=Array.from(hs);
      files=files.filter(function(x){return x.type!=='sales'});sf.forEach(function(p){files.push({type:'sales',name:p.fname})});
    }

    bad.forEach(function(b){store.warn.push('File dilewati: '+b.name+' ('+b.err+')')});
    if(!store.sales.length)store.warn.push('Belum ada laporan Penjualan Barang Konsinyasi. Unggah juga laporan penjualannya.');
    if(!store.inv.length)store.warn.push('Belum ada laporan Umur Persediaan.');
    rebuild();renderAll();
    toast('Data dimuat: '+invBy.size+' cabang'+(sf.length?', periode '+fmtDate(meta.from)+' s/d '+fmtDate(meta.to):'')+'.'+(bad.length?' '+bad.length+' file dilewati, lihat tab Data.':''));

}

var M=null,F={cab:'',sup:''};
var S=Object.assign({fast:90,slow:365,sg:300,sm:600,age:120},lsGet('dse_settings2',{}));
function rebuild(){
  var s=store,info=new Map(),IB=new Map(),cabs=new Set(),sups=new Set();
  s.inv.forEach(function(r){cabs.add(r.cab);if(!info.has(r.kode))info.set(r.kode,{nama:r.nama,sup:r.sup})});
  s.sales.forEach(function(r){cabs.add(r.cab);if(!info.has(r.kode))info.set(r.kode,{nama:r.nama,sup:r.sup})});
  info.forEach(function(v){sups.add(v.sup)});
  function get(kode,cab){var k=kode+'\u0001'+cab,e=IB.get(k);if(!e){var i=info.get(kode);e={kode:kode,nama:i.nama,sup:i.sup,cab:cab,stok:0,b:[0,0,0,0,0],old:0,sq:0,rp:0,hasInv:false};IB.set(k,e)}return e}
  var neg=0,negN=0;
  s.inv.forEach(function(r){var e=get(r.kode,r.cab);e.stok+=r.stok;for(var i=0;i<5;i++)e.b[i]+=r.b[i];e.hasInv=true;if(r.stok<0){neg+=r.stok;negN++}});
  s.sales.forEach(function(r){var e=get(r.kode,r.cab);e.sq+=r.qty;e.rp+=r.rp});
  var gs=new Map(),gsc=new Map();
  IB.forEach(function(e){if(e.sq>0){gs.set(e.kode,(gs.get(e.kode)||0)+e.sq);if(!gsc.has(e.kode))gsc.set(e.kode,[]);gsc.get(e.kode).push(e)}});
  gsc.forEach(function(a){a.sort(function(x,y){return y.sq-x.sq})});

  var days=(from&&to)?Math.round((Date.parse(to)-Date.parse(from))/864e5)+1:0;
  var warn=(s.warn||[]).slice();
  var invCabs=new Set(s.inv.map(function(r){return r.cab})),need=new Set((s.meta.hdr||[]).concat(s.sales.map(function(r){return r.cab})));
  need.forEach(function(c){if(!invCabs.has(c)&&s.inv.length)warn.push('Cabang '+c+' ada di laporan penjualan, tetapi file Umur Persediaannya belum diunggah. Stok cabang ini belum terhitung.')});
  if(negN)warn.push(negN+' baris stok bernilai minus (total '+fmt(neg)+' pcs). Tetap ikut dihitung di Total stok.');

function applyAge(){var st=Math.round(S.age/30);M.IB.forEach(function(e){var t=0;if(e.hasInv)for(var i=st;i<5;i++)t+=e.b[i];e.old=t})}
function ageTxt(){return S.age?'lebih dari '+S.age+' hari':'semua umur'}
function ageShort(){return S.age?'>'+S.age+' hari':'semua umur'}
function fillSelects(){
  var c=$('#fCab'),s=$('#fSup');
  c.innerHTML='<option value="">Semua cabang ('+M.cabs.length+')</option>'+M.cabs.map(function(x){return '<option>'+esc(x)+'</option>'}).join('');
  s.innerHTML='<option value="">Semua supplier ('+M.sups.length+')</option>'+M.sups.map(function(x){return '<option>'+esc(x)+'</option>'}).join('');
  if(M.cabs.indexOf(F.cab)<0)F.cab='';if(M.sups.indexOf(F.sup)<0)F.sup='';
  c.value=F.cab;s.value=F.sup;$('#fAge').value=String(S.age);

var inScope=function(e){return (!F.cab||e.cab===F.cab)&&(!F.sup||e.sup===F.sup)};
function computeScope(){
  var V={stok:0,old:0,dead:0,retur:0,sales:0,rp:0,sku:new Set()};
  M.IB.forEach(function(e){if(!inScope(e))return;
    if(e.hasInv){V.stok+=e.stok;V.old+=e.old;if(e.stok>0)V.sku.add(e.kode)}
    V.sales+=pos(e.sq);V.rp+=e.rp;
    if(e.old>0&&e.sq<=0){V.dead+=e.old;if(!M.gs.get(e.kode))V.retur+=e.old}});
  V.pindah=V.dead-V.retur;return V;
}
function perBranch(){
  var m=new Map();M.cabs.forEach(function(c){m.set(c,{cab:c,stok:0,old:0,dead:0,sales:0,b:[0,0,0,0,0]})});
  M.IB.forEach(function(e){if(F.sup&&e.sup!==F.sup)return;var r=m.get(e.cab);
    if(e.hasInv){r.stok+=e.stok;r.old+=e.old;for(var i=0;i<5;i++)r.b[i]+=e.b[i]}
    r.sales+=pos(e.sq);if(e.old>0&&e.sq<=0)r.dead+=e.old});
  var a=Array.from(m.values()).filter(function(r){return r.stok>0||r.sales>0});
  a.forEach(function(r){r.oldp=r.stok>0?r.old/r.stok:0;r.deadp=r.stok>0?r.dead/r.stok:0});return a;
}
function perSupplier(){
  var m=new Map();M.sups.forEach(function(s){m.set(s,{sup:s,stok:0,old:0,sales:0,rp:0})});
  M.IB.forEach(function(e){if(F.cab&&e.cab!==F.cab)return;var r=m.get(e.sup);if(e.hasInv){r.stok+=pos(e.stok);r.old+=e.old}r.sales+=pos(e.sq);r.rp+=e.rp});
  var a=[];m.forEach(function(r){
    if(r.stok<=0&&r.sales<=0)return;
    r.cover=(r.sales>0&&M.days)?r.stok/(r.sales/M.days):null;
    r.rating=r.sales<=0?'Buruk':(r.cover<=S.sg?'Bagus':(r.cover<=S.sm?'Sedang':'Buruk'));a.push(r)});
  return a;
}
function perItem(){
  var m=new Map();
  M.IB.forEach(function(e){if(!inScope(e))return;var r=m.get(e.kode);if(!r){r={kode:e.kode,nama:e.nama,sup:e.sup,stok:0,sales:0};m.set(e.kode,r)}r.stok+=pos(e.stok);r.sales+=pos(e.sq)});
  var a=[];m.forEach(function(r){
    if(r.stok<=0)return;
    r.cover=(r.sales>0&&M.days)?r.stok/(r.sales/M.days):null;
    r.cls=r.sales<=0?'Tanpa penjualan':(r.cover<=S.fast?'Fast':(r.cover>S.slow?'Slow':'Normal'));a.push(r)});
  return a;
}
function deadLists(){
  var retur=new Map(),pindah=[];
  M.IB.forEach(function(e){
    if(!inScope(e)||!(e.old>0&&e.sq<=0))return;
    var g=M.gs.get(e.kode)||0;
    if(g<=0){var r=retur.get(e.kode);if(!r){r={kode:e.kode,nama:e.nama,sup:e.sup,old:0,stok:0,sp:[]};retur.set(e.kode,r)}r.old+=e.old;r.stok+=pos(e.stok);r.sp.push([e.cab,e.old])}
    else{
      var dest=(M.gsc.get(e.kode)||[]).filter(function(x){return x.cab!==e.cab}).slice(0,3);
      pindah.push({cab:e.cab,sup:e.sup,kode:e.kode,nama:e.nama,old:e.old,stok:pos(e.stok),elsewhere:g,
        dest:dest.map(function(x){return x.cab+' (terjual '+fmt(x.sq)+', stok '+fmt(pos(x.stok))+')'}).join(' · ')});
    }
  });
  var R=Array.from(retur.values());R.forEach(function(r){r.sp.sort(function(a,b){return b[1]-a[1]});r.spread=r.sp.map(function(x){return x[0]+' '+fmt(x[1])}).join(' · ');r.nc=r.sp.length});
  return {retur:R,pindah:pindah};
}

var TBL={},clsF='',ratF='',deadSub='retur',tab=(location.hash||'#ringkasan').slice(1);
var TABS=[['ringkasan','Ringkasan'],['deadstock','Dead Stock'],['movement','Fast / Slow Moving'],['supplier','Supplier'],['data','Data dan Cara Pakai']];

function regTable(id,cfg){var o=TBL[id];cfg.sort=o&&o.keep?o.sort:cfg.sort;cfg.q=o?o.q:'';cfg.lim=100;cfg.keep=true;TBL[id]=cfg}

  if(!full){if(t.filt)rows=rows.filter(t.filt);if(q)rows=rows.filter(function(r){return t.search.some(function(k){return String(r[k]).toLowerCase().indexOf(q)>=0})})}
  if(t.sort){var k=t.sort.k,d=t.sort.dir;rows.sort(function(a,b){var x=a[k],y=b[k];if(typeof x==='string'||typeof y==='string')return d*String(x==null?'':x).localeCompare(String(y==null?'':y),'id');return d*((x==null?1e18:x)-(y==null?1e18:y))})}
  return rows;
}
function drawTable(id){

function plain(s){return s.replace(/<[^>]+>/g,'').replace(/&gt;/g,'>')}
function copyTable(id){

/* ===== tampilan ===== */
function kpi(l,v,u,meta,cls,meter){return '<div class="kpi '+(cls||'')+'"><div class="lbl">'+l+'</div><div class="val">'+v+'<small>'+u+'</small></div><div class="meta">'+meta+'</div>'+(meter!=null?'<div class="meter"><i style="width:'+Math.min(100,meter*100).toFixed(1)+'%"></i></div>':'')+'</div>'}
function kpis(V){
  var oldp=V.stok>0?V.old/V.stok:0,deadp=V.stok>0?V.dead/V.stok:0;
  return '<div class="grid g3">'+
    kpi('Total stok',fmt(V.stok),'pcs',fmt(V.sku.size)+' jenis barang · '+(F.cab?esc(F.cab):M.cabs.length+' cabang'))+
    kpi('Stok berumur '+ageShort().replace('>','&gt;'),fmt(V.old),'pcs','<b>'+pct(oldp)+'</b> dari total stok','',oldp)+
    kpi('Stok tua tanpa penjualan',fmt(V.dead),'pcs','<b>'+pct(deadp)+'</b> dari total stok · '+pct(V.old>0?V.dead/V.old:0)+' dari stok tua','hl',deadp)+'</div>';
}
function periodBanner(){return M.days&&M.days<60?'<div class="warnbox">Penjualan yang dibaca hanya <b>'+M.days+' hari</b> ('+esc(fmtDate(M.from))+' s/d '+esc(fmtDate(M.to))+'). Barang yang terlihat "tanpa penjualan" bisa jadi hanya belum sempat terjual. Untuk memutuskan retur, sebaiknya gunakan laporan penjualan minimal 3 bulan.</div>':''}
function ageBars(rows){
  var mx=Math.max.apply(null,rows.map(function(r){return r.b.reduce(function(a,b){return a+b},0)}).concat([1]));
  return '<div class="legend">'+AGE.map(function(l,i){return '<span><i style="background:'+AGEC[i]+'"></i>'+l+'</span>'}).join('')+'</div>'+
  rows.map(function(r){var tot=r.b.reduce(function(a,b){return a+b},0);
    var tip=r.cab+'\n'+AGE.map(function(l,i){return l+': '+fmt(r.b[i])+' pcs'}).join('\n');
    return '<div class="hb'+(r.cab===F.cab?' sel':'')+'" data-tip="'+esc(tip)+'"><div class="nm" title="'+esc(r.cab)+'">'+esc(r.cab)+'</div><div class="tr" style="width:'+(tot/mx*100).toFixed(2)+'%">'+
      r.b.map(function(v,i){return v>0?'<span style="flex:'+v+' 1 0;background:'+AGEC[i]+'"></span>':''}).join('')+'</div><div class="v">'+fmt(tot)+'</div></div>'}).join('');
}

function renderAll(){

  var h;if(!M.IB.length)tab='data';

function setTab(t,sub){tab=t;if(sub)deadSub=sub;try{history.replaceState(null,'','#'+t)}catch(e){}renderAll();window.scrollTo(0,0)}

/* ===== unduh Excel (penulis .xlsx sendiri) ===== */
var CRCT=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){var c=-1;for(var i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return (c^-1)>>>0}
function zipStore(files){
  var enc=new TextEncoder(),parts=[],cd=[],off=0;
  files.forEach(function(f){
    var nm=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data);
    var lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nm,data);
    var ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+data.length;
  });
  var cs=0;cd.forEach(function(p){cs+=p.length});
  var e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob(parts.concat(cd,[new Uint8Array(e.buffer)]),{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
var xe=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'')};
function colName(i){var s='';i++;while(i>0){var m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
/* sel: nilai biasa, atau {v,s}. s: 1=judul kolom, 2=angka, 3=persen, 4=judul besar */
function sheetXml(aoa,freeze){
  var widths=[],rowsX=aoa.map(function(row,ri){
    return '<row r="'+(ri+1)+'">'+row.map(function(c,ci){
      var v=c,s=0;if(c&&typeof c==='object'){v=c.v;s=c.s||0}
      if(v==null||v==='')return '';
      var len=String(typeof v==='number'?Math.round(v):v).length+(s===1?2:0);if(ri<250&&s!==4)widths[ci]=Math.max(widths[ci]||8,Math.min(60,len+2));
      var ref=colName(ci)+(ri+1);
      if(typeof v==='number'&&isFinite(v)){if(!s&&Math.floor(v)===v)s=2;return '<c r="'+ref+'"'+(s?' s="'+s+'"':'')+'><v>'+v+'</v></c>'}
      return '<c r="'+ref+'" t="inlineStr"'+(s?' s="'+s+'"':'')+'><is><t xml:space="preserve">'+xe(v)+'</t></is></c>';
    }).join('')+'</row>'}).join('');
  var cols=widths.length?'<cols>'+widths.map(function(w,i){return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+(w||8)+'" customWidth="1"/>'}).join('')+'</cols>':'';
  var view=freeze?'<sheetViews><sheetView workbookViewId="0"><pane ySplit="'+freeze+'" topLeftCell="A'+(freeze+1)+'" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>':'<sheetViews><sheetView workbookViewId="0"/></sheetViews>';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+view+cols+'<sheetData>'+rowsX+'</sheetData></worksheet>';
}
function tableAoa(id){
  var t=TBL[id],rows=tableRows(id,true);
  var out=[t.cols.map(function(c){return {v:plain(c.l),s:1}})];
  rows.forEach(function(r){out.push(t.cols.map(function(c){var v=c.raw?c.raw(r):r[c.k];if(c.pct&&typeof v==='number')return {v:v,s:3};return v==null?'':v}))});
  return out;
}
function buildWorkbook(){
  var V=computeScope();buildTables();
  var flt=(F.cab||'Semua cabang')+' · '+(F.sup||'Semua supplier')+' · stok tua = '+ageTxt();
  var br=TBL.brn.rows.slice().sort(function(a,b){return b.stok-a.stok});
  var oldp=V.stok>0?V.old/V.stok:0,deadp=V.stok>0?V.dead/V.stok:0;
  var rk=[[{v:'Laporan Stok Konsinyasi - DSE Factory Outlet',s:4}],['Periode penjualan: '+fmtDate(M.from)+' s/d '+fmtDate(M.to)+' ('+M.days+' hari)'],['Stok per tanggal: '+fmtDate(M.asof)],['Filter: '+flt],[''],
    [{v:'Ringkasan',s:1},{v:'Pcs',s:1},{v:'%',s:1}],
    ['Total stok',V.stok,''],['Stok berumur '+ageShort(),V.old,{v:oldp,s:3}],['Stok tua tanpa penjualan',V.dead,{v:deadp,s:3}],['   - perlu diretur ke supplier',V.retur,''],['   - layak dipindah antar cabang',V.pindah,''],[''],
    [{v:'Per cabang',s:1},{v:'Total stok (pcs)',s:1},{v:'Stok tua (pcs)',s:1},{v:'% stok tua',s:1},{v:'Stok tua tanpa penjualan (pcs)',s:1},{v:'% dari total stok',s:1}]];
  br.forEach(function(r){rk.push([r.cab,r.stok,r.old,{v:r.oldp,s:3},r.dead,{v:r.deadp,s:3}])});
  var ag=[[{v:'Cabang',s:1}].concat(AGE.map(function(a){return {v:a+' (pcs)',s:1}})).concat([{v:'Total (pcs)',s:1}])];
  br.forEach(function(r){ag.push([r.cab].concat(r.b).concat([r.b.reduce(function(a,b){return a+b},0)]))});
  var sheets=[['Ringkasan',rk,0],['Umur Stok per Cabang',ag,1],['Retur ke Supplier',tableAoa('retur'),1],['Pindah Cabang',tableAoa('pindah'),1],['Fast-Slow Moving',tableAoa('mv'),1],['Supplier',tableAoa('sup'),1]];
  var ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map(function(s,i){return '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'}).join('')+'</Types>';
  var wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map(function(s,i){return '<sheet name="'+xe(s[0])+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>'}).join('')+'</sheets></workbook>';
  var wr='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map(function(s,i){return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>'}).join('')+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  var rr='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  var st='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE3EDF9"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="9" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  var files=[{name:'[Content_Types].xml',data:ct},{name:'_rels/.rels',data:rr},{name:'xl/workbook.xml',data:wb},{name:'xl/_rels/workbook.xml.rels',data:wr},{name:'xl/styles.xml',data:st}];
  sheets.forEach(function(s,i){files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',data:sheetXml(s[1],s[2])})});

}
function downloadXlsx(){
  var blob;try{blob=buildWorkbook()}catch(e){toast('Gagal membuat file Excel: '+e.message);return}
  var nm='Laporan_Stok_Konsinyasi_'+(M.to||'')+(F.cab?'_'+F.cab.replace(/\s+/g,''):'')+'.xlsx';
  var local=function(){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nm;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);toast('Laporan Excel diunduh: '+nm)};
  if(window.claude&&window.claude.use){
    window.claude.use('downloads').then(function(dl){
      if(!dl)return local();
      dl.save({filename:nm,data:blob}).then(function(){toast('Laporan Excel disimpan: '+nm)},function(e){if(e&&e.code==='declined')toast('Unduhan dibatalkan.');else toast('Unduhan tidak tersedia di tampilan ini. Gunakan tombol "Salin tabel" atau buka dashboard dari file HTML.')});
    },local);
  }else local();
}

/* ===== event ===== */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-tab],[data-sort],[data-more],[data-copy],[data-go],[data-sub],[data-cls],[data-rat],[data-pick],tr.clk');if(!el)return;
  if(el.dataset.tab)return setTab(el.dataset.tab);
  if(el.dataset.go)return setTab(el.dataset.go,el.dataset.sub);
  if(el.dataset.pick)return $('#file').click();
  if(el.dataset.sub){deadSub=el.dataset.sub;return renderAll()}
  if(el.dataset.cls){clsF=clsF===el.dataset.cls?'':el.dataset.cls;return renderAll()}
  if(el.dataset.rat){ratF=ratF===el.dataset.rat?'':el.dataset.rat;return renderAll()}
  if(el.dataset.sort){var t=TBL[el.dataset.t],k=el.dataset.sort;t.sort=t.sort&&t.sort.k===k?{k:k,dir:-t.sort.dir}:{k:k,dir:(t.cols.filter(function(c){return c.k===k})[0].n?-1:1)};return drawTable(el.dataset.t)}
  if(el.dataset.more){TBL[el.dataset.more].lim+=200;return drawTable(el.dataset.more)}
  if(el.dataset.copy)return copyTable(el.dataset.copy);
  if(el.matches('tr.clk')){var tt=TBL[el.dataset.t],row=tt.view[+el.dataset.i];if(row&&tt.onRow)tt.onRow(row)}
});
var inputTimer;
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.q){var tb=TBL[t.dataset.q];tb.q=t.value;tb.lim=100;drawTable(t.dataset.q);return}
  var map={sFast:'fast',sSlow:'slow',sG:'sg',sM:'sm'};
  if(map[t.id]){var v=parseFloat(t.value);if(v>0){S[map[t.id]]=v;lsSet('dse_settings2',S);clearTimeout(inputTimer);inputTimer=setTimeout(function(){var id=t.id,p=t.selectionStart;renderAll();var n=$('#'+id);if(n){n.focus();try{n.setSelectionRange(p,p)}catch(e){}}},400)}}
});
$('#fCab').addEventListener('change',function(e){F.cab=e.target.value;renderAll()});
$('#fSup').addEventListener('change',function(e){F.sup=e.target.value;renderAll()});
$('#fAge').addEventListener('change',function(e){S.age=+e.target.value;lsSet('dse_settings2',S);applyAge();renderAll()});

['dragleave','drop'].forEach(function(n){document.addEventListener(n,function(e){var d=$('#drop');if(d)d.classList.remove('over');if(n==='drop'&&e.dataTransfer&&e.dataTransfer.files.length){e.preventDefault();ingest(Array.from(e.dataTransfer.files).filter(function(f){return /\.xlsx$/i.test(f.name)}))}})});

document.addEventListener('mousemove',function(e){var el=e.target.closest&&e.target.closest('[data-tip]');if(!el){tip.style.display='none';return}
  tip.textContent=el.getAttribute('data-tip');tip.style.display='block';var x=e.clientX+14,y=e.clientY+14,w=tip.offsetWidth,h=tip.offsetHeight;

})();
