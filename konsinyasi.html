<title>Dashboard Stok Konsinyasi DSE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky filter bar on top, five tabs (summary first), panels on a quiet ground, tables scroll inside their own box */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#f7f9fb; --line:#dfe4ea; --line-2:#eaeef3;
  --fg:#12202f; --fg-2:#4a596a; --fg-3:#76848f;
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e6f0fc;
  --old:#eb6834; --old-soft:#fdeee7;
  --a1:#86b6ef; --a2:#5598e7; --a3:#2a78d6; --a4:#1c5cab; --a5:#eb6834;
  --good:#17803f; --good-soft:#e3f4ea; --warn:#a96f00; --warn-soft:#fbf0d6; --bad:#c93a2b; --bad-soft:#fbe6e3;
  --shadow:0 1px 2px rgba(18,32,47,.06);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1722; --surface:#172231; --surface-2:#1c2a3b; --line:#2a3a4e; --line-2:#223145;
  --fg:#e8eef5; --fg-2:#aebbca; --fg-3:#8091a3;
  --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1b3250;
  --old:#d95926; --old-soft:#3a2418;
  --a1:#86b6ef; --a2:#5598e7; --a3:#3987e5; --a4:#2a78d6; --a5:#e8703a;
  --good:#4cc283; --good-soft:#163a2a; --warn:#e3a82b; --warn-soft:#3b2f12; --bad:#ef7664; --bad-soft:#3d1f1b;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1722; --surface:#172231; --surface-2:#1c2a3b; --line:#2a3a4e; --line-2:#223145;
  --fg:#e8eef5; --fg-2:#aebbca; --fg-3:#8091a3;
  --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1b3250;
  --old:#d95926; --old-soft:#3a2418;
  --a1:#86b6ef; --a2:#5598e7; --a3:#3987e5; --a4:#2a78d6; --a5:#e8703a;
  --good:#4cc283; --good-soft:#163a2a; --warn:#e3a82b; --warn-soft:#3b2f12; --bad:#ef7664; --bad-soft:#3d1f1b;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1360px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) ;padding:10px max(16px,env(safe-area-inset-left,0px)) 0}
.top-in{max-width:1360px;margin:0 auto}
.row1{display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--fg-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--fg-2);white-space:nowrap}
.chip b{font-weight:600;color:var(--fg)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.filters label{display:flex;flex-direction:column;font-size:11px;color:var(--fg-3);gap:2px;text-transform:uppercase;letter-spacing:.06em}
select,.inp{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;font-size:13px;text-transform:none;letter-spacing:0;color:var(--fg)}
select{max-width:200px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 12px;font-weight:600;font-size:13px}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:5px 9px;font-size:12px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;font-weight:600;color:var(--fg-2);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .cnt{font-weight:500;font-size:11px;background:var(--old-soft);color:var(--old);border-radius:999px;padding:0 6px;margin-left:4px}
/* body */
main{padding-top:16px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.panel h3{margin:0 0 2px;font-size:14px;font-weight:700}
.panel .sub{font-size:12px;color:var(--fg-3);margin:0 0 10px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g3{grid-template-columns:minmax(0,1fr)}}
@media(max-width:520px){.g4{grid-template-columns:minmax(0,1fr)}.filters{margin-left:0;width:100%}.filters label,select{width:100%;max-width:none}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.kpi .lbl{font-size:12px;color:var(--fg-2);font-weight:600}
.kpi .val{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:4px}
.kpi .val small{font-size:14px;font-weight:500;color:var(--fg-3);margin-left:4px;letter-spacing:0}
.kpi .meta{font-size:12px;color:var(--fg-3);margin-top:4px}
.kpi.hl{border-color:var(--old)}
.kpi.hl .val{color:var(--old)}
.meter{height:6px;background:var(--line-2);border-radius:3px;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.kpi.hl .meter i{background:var(--old)}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.act{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;width:100%}
.act:hover{border-color:var(--accent)}
.act .big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.act .t{font-weight:600}
.act .d{font-size:12px;color:var(--fg-3)}
.tag{font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px;white-space:nowrap;display:inline-block}
.tag.retur{background:var(--bad-soft);color:var(--bad)}
.tag.pindah{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.fast{background:var(--good-soft);color:var(--good)}
.pill.normal{background:var(--accent-soft);color:var(--accent)}
.pill.slow{background:var(--warn-soft);color:var(--warn)}
.pill.none{background:var(--bad-soft);color:var(--bad)}
/* bars */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--fg-2);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;gap:8px;align-items:center;padding:3px 0;font-size:13px}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg-2)}
.hb.sel .nm{color:var(--fg);font-weight:700}
.hb .tr{display:flex;gap:2px;height:16px}
.hb .tr span{display:block;height:100%;min-width:0}
.hb .tr span:first-child{border-radius:2px 0 0 2px}.hb .tr span:last-child{border-radius:0 4px 4px 0}
.hb .v{text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
.vb{display:flex;gap:6px;align-items:flex-end;height:190px;padding-top:18px}
.vb .c{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.vb .bar{width:100%;max-width:44px;background:var(--a3);border-radius:4px 4px 0 0;min-height:2px}
.vb .bar.part{background:var(--a1)}
.vb .nv{font-size:11px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.vb .ml{font-size:11px;color:var(--fg-3);white-space:nowrap}
/* tables */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools .inp{min-width:200px;flex:1;max-width:340px}
.tools .grow{flex:1}
.scroll{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:12px;font-weight:600;color:var(--fg-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
th.n,td.n{text-align:right}
th .ar{color:var(--accent);margin-left:3px}
td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
td.wrap{white-space:normal;min-width:180px}
td.nowrap{white-space:nowrap}
td.mono{font-family:var(--mono);font-size:12px}
tr.clk{cursor:pointer}
tr.clk:hover td,tr.sel td{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--fg-3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:7px 12px;font-weight:600;font-size:13px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.set{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.set label{display:flex;flex-direction:column;font-size:11px;color:var(--fg-3);gap:3px;text-transform:uppercase;letter-spacing:.05em}
.set .inp{width:92px}
.note{font-size:12px;color:var(--fg-3)}
.cls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media(max-width:800px){.cls{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cl{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;text-align:left}
.cl[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cl b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.cl span{font-size:12px;color:var(--fg-3)}
.scorebar{display:inline-block;height:8px;border-radius:4px;vertical-align:middle;margin-right:6px}
.warnbox{border:1px solid var(--warn);background:var(--warn-soft);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:13px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
dl.def{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);gap:8px 16px;margin:0}
dl.def dt{font-weight:600}dl.def dd{margin:0;color:var(--fg-2)}
@media(max-width:620px){dl.def{grid-template-columns:minmax(0,1fr)}}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;max-width:280px;display:none;white-space:pre-line}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;font-size:13px;display:none;max-width:90vw}
svg text{font-family:var(--sans)}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s}}
</style>

function parseSheet(name,rows){

    if(t.indexOf('Tanggal')>=0&&t.some(function(x){return /^Kuantitas/.test(x)})){hi=i;kind='sales';break}
  }
  if(hi<0)throw new Error('Format kolom tidak dikenali (bukan laporan Umur Persediaan / Sales Konsi).');
  var H=rows[hi].map(cellText);

  var m;

    var cab=(m=head.match(/Cabang\s*:\s*([^,|]+?)\s*,/))?m[1].trim():null;
    if(!cab)throw new Error('Nama cabang tidak ditemukan di baris judul ("Cabang : ...").');
    var asof=(m=head.match(/Per Tgl\.?\s*(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/))?dmy(m[1],m[2],m[3]):null;
    var c={sup:find(function(x){return /^Nama Pemasok/.test(x)}),kode:find(function(x){return x==='Kode Barang'}),nama:find(function(x){return x==='Nama Barang'}),stok:find(function(x){return x==='Stok'}),
      b:['1 - 30','31 - 60','61 - 90','91 - 120','> 120'].map(function(l){return find(function(x){return x===l})})};
    if(c.sup<0||c.kode<0||c.stok<0||c.b.indexOf(-1)>=0)throw new Error('Kolom umur (1-30 ... >120) tidak lengkap.');
    var sup=null,out=[];
    for(i=hi+1;i<rows.length;i++){
      r=rows[i];var sv=cellText(r[c.sup]);if(sv)sup=sv;
      var kode=cellText(r[c.kode]);if(!kode||/^total/i.test(sv)||/^total/i.test(kode))continue;
      var st=num(r[c.stok]);if(st==null)continue;
      out.push({kode:kode,nama:cellText(r[c.nama]),sup:sup||'(tanpa supplier)',cab:cab,stok:st,b:c.b.map(function(k){return num(r[k])||0})});
    }

  }
  var per=head.match(/Dari\s+(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})\s+s\/d\s+(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
  var c2={tgl:find(function(x){return x==='Tanggal'}),sup:find(function(x){return /^Nama Pemasok/.test(x)}),kode:find(function(x){return /^Kode/.test(x)}),nama:find(function(x){return x==='Nama Barang'}),cab:find(function(x){return x==='Nama Cabang'}),qty:find(function(x){return /^Kuantitas/.test(x)})};
  for(var k in c2)if(c2[k]<0)throw new Error('Kolom "'+k+'" tidak ditemukan pada laporan penjualan.');

    r=rows[i];
    if(r.slice(0,6).some(function(x){return typeof x==='string'&&/^\s*total/i.test(x)}))continue;
    var dd=toISO(r[c2.tgl]);if(dd)d=dd;
    var s1=cellText(r[c2.sup]);if(s1)sp=s1;
    var k1=cellText(r[c2.kode]);if(k1){kd=k1;nm=cellText(r[c2.nama])}
    var cb=cellText(r[c2.cab]),q=num(r[c2.qty]);
    if(!cb||q==null||!kd||!d)continue;
    var key=kd+'\u0001'+cb+'\u0001'+d.slice(0,7),e=agg.get(key);
    if(!e){e={kode:kd,nama:nm,sup:sp||'(tanpa supplier)',cab:cb,ym:d.slice(0,7),qty:0,last:d};agg.set(key,e)}

function readFile(f){

    var wb=XLSX.read(buf,{type:'array'});

function ingest(files){
  if(typeof XLSX==='undefined'){toast('Pustaka pembaca Excel belum termuat. Periksa koneksi internet lalu coba lagi.');return}
  toast('Membaca '+files.length+' file...');
  Promise.all(files.map(function(f){return readFile(f).then(function(p){return {ok:true,p:p}},function(e){return {ok:false,name:f.name,err:e.message}})})).then(function(res){
    var bad=res.filter(function(x){return !x.ok}),good=res.filter(function(x){return x.ok}).map(function(x){return x.p});
    if(!good.length){toast('Tidak ada file yang bisa dibaca. '+(bad[0]?bad[0].name+': '+bad[0].err:''));return}
    var base=isSample?{meta:{},files:[],inv:[],sales:[],warn:[]}:store;
    var invBy=new Map();base.inv.forEach(function(r){if(!invBy.has(r.cab))invBy.set(r.cab,[]);invBy.get(r.cab).push(r)});
    var sales=base.sales,meta=Object.assign({},base.meta),files=base.files.filter(function(x){return x.type!=='bawaan'});
    var newSales=[];
    good.forEach(function(p){
      if(p.kind==='umur'){invBy.set(p.cab,p.rows);files=files.filter(function(x){return !(x.type==='umur'&&x.cab===p.cab)});files.push({type:'umur',name:p.fname,cab:p.cab,n:p.rows.length});if(p.asof&&(!meta.asof||p.asof>meta.asof))meta.asof=p.asof}
      else{newSales=newSales.concat(p.rows);meta.from=!meta.fromN&&p.from;meta.to=p.to;files.push({type:'sales',name:p.fname,n:p.rows.length})}
    });
    if(newSales.length){
      // gabung beberapa file penjualan (jika dipecah), periode = rentang terlebar
      var sf=good.filter(function(p){return p.kind==='sales'});
      meta.from=sf.map(function(p){return p.from}).sort()[0];meta.to=sf.map(function(p){return p.to}).sort().slice(-1)[0];
      sales=newSales;files=files.filter(function(x){return x.type!=='sales'||good.some(function(p){return p.fname===x.name})});
    }
    var inv=[];invBy.forEach(function(v){inv=inv.concat(v)});
    store={meta:meta,files:files,inv:inv,sales:sales,warn:[]};isSample=false;
    bad.forEach(function(b){store.warn.push('File dilewati: '+b.name+' ('+b.err+')')});
    if(!store.sales.length)store.warn.push('Belum ada laporan Sales Konsi. Unggah laporan penjualan agar analisis dead stock dan supplier lengkap.');
    if(!store.inv.length)store.warn.push('Belum ada laporan Umur Persediaan.');
    rebuild();renderAll();
    toast('Data dimuat: '+invBy.size+' cabang, '+(good.filter(function(p){return p.kind==='sales'}).length)+' file penjualan.'+(bad.length?' '+bad.length+' file dilewati.':''));
  });
}

var M=null;
function rebuild(){
  var s=store,info=new Map(),IB=new Map(),cabs=new Set(),sups=new Set();
  s.inv.forEach(function(r){cabs.add(r.cab);sups.add(r.sup);if(!info.has(r.kode))info.set(r.kode,{nama:r.nama,sup:r.sup})});
  s.sales.forEach(function(r){cabs.add(r.cab);if(!info.has(r.kode))info.set(r.kode,{nama:r.nama,sup:r.sup});});
  info.forEach(function(v){sups.add(v.sup)});
  function get(kode,cab){var k=kode+'\u0001'+cab,e=IB.get(k);if(!e){var i=info.get(kode);e={kode:kode,nama:i.nama,sup:i.sup,cab:cab,stok:0,b:[0,0,0,0,0],old:0,sq:0,last:null,hasInv:false};IB.set(k,e)}return e}
  var neg=0,negN=0;
  s.inv.forEach(function(r){var e=get(r.kode,r.cab);e.stok+=r.stok;for(var i=0;i<5;i++)e.b[i]+=r.b[i];e.old=e.b[4];e.hasInv=true;if(r.stok<0){neg+=r.stok;negN++}});
  s.sales.forEach(function(r){var e=get(r.kode,r.cab);e.sq+=r.qty;if(!e.last||r.last>e.last)e.last=r.last});
  var gs=new Map(),gsc=new Map();
  IB.forEach(function(e){if(e.sq>0){gs.set(e.kode,(gs.get(e.kode)||0)+e.sq);if(!gsc.has(e.kode))gsc.set(e.kode,[]);gsc.get(e.kode).push(e)}});
  gsc.forEach(function(a){a.sort(function(x,y){return y.sq-x.sq})});
  var from=s.meta.from,to=s.meta.to||s.meta.asof;
  if(!from&&s.sales.length){from=s.sales.map(function(r){return r.ym+'-01'}).sort()[0]}
  var days=(from&&to)?Math.round((Date.parse(to)-Date.parse(from))/864e5)+1:0;
  var warn=(s.warn||[]).slice();
  if(negN)warn.push(negN+' baris stok bernilai negatif (total '+fmt(neg)+' pcs). Dihitung apa adanya pada Total stok, diabaikan pada analisis kecepatan jual.');
  var invCabs=new Set(s.inv.map(function(r){return r.cab})),salCabs=new Set(s.sales.map(function(r){return r.cab}));
  salCabs.forEach(function(c){if(!invCabs.has(c))warn.push('Cabang "'+c+'" ada di laporan penjualan tetapi laporan umur persediaannya belum diunggah.')});
  invCabs.forEach(function(c){if(s.sales.length&&!salCabs.has(c))warn.push('Cabang "'+c+'" tidak punya penjualan sama sekali pada laporan penjualan (pastikan cabang ikut dipilih saat ekspor).')});
  var soldNoInv=new Set();IB.forEach(function(e){if(!e.hasInv&&e.sq>0)soldNoInv.add(e.kode)});
  M={IB:Array.from(IB.values()),gs:gs,gsc:gsc,cabs:Array.from(cabs).sort(),sups:Array.from(sups).sort(function(a,b){return a.localeCompare(b,'id',{sensitivity:'base'})}),
     from:from,to:to,asof:s.meta.asof,days:days,warn:warn,info:info,soldNoInv:soldNoInv.size,byKey:IB};
  if(!days)M.warn.push('Periode penjualan tidak terbaca. Kecepatan jual tidak dapat dihitung.');
  fillSelects();
}

  V.rows=sc;
  V.stok=0;V.old=0;V.dead=0;V.retur=0;V.sales=0;V.sku=new Set();V.ageSum=[0,0,0,0,0];

  });

function perBranch(){ // abaikan filter cabang, ikuti filter supplier
  var m=new Map();M.cabs.forEach(function(c){m.set(c,{cab:c,stok:0,old:0,dead:0,sales:0,b:[0,0,0,0,0]})});

    if(e.hasInv){r.stok+=e.stok;r.old+=e.old;for(var i=0;i<5;i++)r.b[i]+=e.b[i]}
    r.sales+=pos(e.sq);if(e.old>0&&e.sq<=0)r.dead+=e.old});
  var a=Array.from(m.values());a.forEach(function(r){r.oldp=r.stok>0?r.old/r.stok:0;r.deadp=r.stok>0?r.dead/r.stok:0;r.st=(r.sales+pos(r.stok))>0?r.sales/(r.sales+pos(r.stok)):0});

}

var deadSub='retur';
function deadLists(){
  var retur=new Map(),pindah=[];
  M.IB.filter(inScope).forEach(function(e){
    if(!(e.old>0&&e.sq<=0))return;
    var g=M.gs.get(e.kode)||0;
    if(g<=0){var r=retur.get(e.kode);if(!r){r={kode:e.kode,nama:e.nama,sup:e.sup,old:0,stok:0,sp:[]};retur.set(e.kode,r)}
      r.old+=e.old;r.stok+=pos(e.stok);r.sp.push([e.cab,e.old])}
    else{
      var dest=(M.gsc.get(e.kode)||[]).filter(function(x){return x.cab!==e.cab}).slice(0,3);
      pindah.push({cab:e.cab,sup:e.sup,kode:e.kode,nama:e.nama,old:e.old,stok:pos(e.stok),elsewhere:g,
        dest:dest.map(function(x){return x.cab+' (terjual '+fmt(x.sq)+', stok '+fmt(pos(x.stok))+')'}).join(' · '),best:dest.length?dest[0].cab:''});
    }
  });
  var R=Array.from(retur.values());R.forEach(function(r){r.sp.sort(function(a,b){return b[1]-a[1]});r.spread=r.sp.map(function(x){return x[0]+' '+fmt(x[1])}).join(' · ');r.nc=r.sp.length});
  return {retur:R,pindah:pindah};
}

function scatter(a,RC){
  if(!a.length)return '';
  var W=720,Hh=330,L=52,R=14,T=14,B=44,pw=W-L-R,ph=Hh-T-B;
  var mxX=Math.max(0.1,Math.ceil(Math.max.apply(null,a.map(function(r){return r.st}))*10)/10),mxS=Math.max.apply(null,a.map(function(r){return r.stok}).concat([1]));
  var X=function(v){return L+v/mxX*pw},Y=function(v){return T+(1-v)*ph};
  var col={Bagus:'var(--good)',Sedang:'var(--warn)',Buruk:'var(--bad)'};
  var s='<svg viewBox="0 0 '+W+' '+Hh+'" width="100%" role="img" aria-label="Sebaran supplier: sell-through terhadap persentase stok tua" style="max-width:860px;display:block">';
  for(var i=0;i<=4;i++){var v=i/4;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line-2)"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--fg-3)">'+Math.round(v*100)+'%</text>'}
  for(i=0;i<=5;i++){var xv=mxX*i/5;s+='<text x="'+X(xv)+'" y="'+(Hh-B+16)+'" text-anchor="middle" font-size="11" fill="var(--fg-3)">'+Math.round(xv*100)+'%</text>'}
  s+='<text x="'+(L+pw/2)+'" y="'+(Hh-6)+'" text-anchor="middle" font-size="12" fill="var(--fg-2)">Sell-through (makin tinggi makin baik) →</text>';
  s+='<text transform="translate(13 '+(T+ph/2)+') rotate(-90)" text-anchor="middle" font-size="11" fill="var(--fg-2)">% stok berumur &gt;120 hari (makin rendah makin baik)</text>';
  var big=a.slice().sort(function(x,y){return y.stok-x.stok}).slice(0,5).map(function(r){return r.sup});
  a.slice().sort(function(x,y){return y.stok-x.stok}).forEach(function(r){

  });
  a.forEach(function(r){if(big.indexOf(r.sup)>=0){var rad=4+Math.sqrt(r.stok/mxS)*13;s+='<text x="'+(X(r.st)+rad+4)+'" y="'+(Y(r.oldp)+4)+'" font-size="11" fill="var(--fg)" style="pointer-events:none">'+esc(r.sup.length>22?r.sup.slice(0,21)+'…':r.sup)+'</text>'}});
  s+='</svg><div class="legend" style="margin:6px 0 0"><span><i style="background:var(--good);border-radius:50%"></i>Bagus</span><span><i style="background:var(--warn);border-radius:50%"></i>Sedang</span><span><i style="background:var(--bad);border-radius:50%"></i>Buruk</span><span class="note">Ukuran titik = jumlah stok. Nama ditampilkan untuk 5 supplier dengan stok terbesar.</span></div>';
  return s;
}

    '<li>Klik <b>Muat data baru</b>, pilih semua file sekaligus. Cabang atau supplier baru terbaca otomatis dan langsung muncul di filter.</li>'+
    '<li>Jika hanya satu cabang yang berubah, cukup unggah file cabang itu: file lama untuk cabang yang sama diganti, cabang lain tetap.</li></ol>'+
    '<p class="note" style="margin:12px 0 0">Data tidak tersimpan setelah halaman ditutup. Simpan file Excel asli dan unggah lagi bila diperlukan.</p></div>'+
    '<div class="panel"><h3>Definisi</h3><dl class="def">'+
    '<dt>Stok &gt;120 hari</dt><dd>Pcs pada kolom &quot;&gt; 120&quot; di laporan umur persediaan.</dd>'+
    '<dt>Stok tua tanpa penjualan</dt><dd>Stok &gt;120 hari pada SKU yang tidak terjual (kuantitas bersih ≤ 0) di cabang tersebut selama periode.</dd>'+
    '<dt>Retur ke supplier</dt><dd>Stok tua tanpa penjualan pada SKU yang juga tidak terjual di cabang mana pun.</dd>'+
    '<dt>Pindah cabang</dt><dd>Stok tua tanpa penjualan di suatu cabang, sedangkan SKU itu terjual di cabang lain.</dd>'+
    '<dt>Cover stok</dt><dd>Stok ÷ (terjual ÷ jumlah hari periode). Perkiraan berapa hari stok habis pada laju jual rata-rata.</dd>'+
    '<dt>Sell-through</dt><dd>Terjual ÷ (terjual + stok saat ini).</dd>'+
    '<dt>Pembacaan laporan</dt><dd>Sel kosong pada kolom tanggal, supplier, kode, dan nama barang diisi dengan nilai terakhir di atasnya (forward fill).</dd>'+
    '<dt>Satuan</dt><dd>Seluruh angka dalam pcs. Laporan tidak memuat harga, sehingga nilai rupiah tidak dihitung.</dd></dl></div></div>';
  return h;
}
function perBranchAll(){var m=new Map(),sk=new Map();M.IB.forEach(function(e){var r=m.get(e.cab);if(!r){r={cab:e.cab,stok:0,sales:0};m.set(e.cab,r);sk.set(e.cab,new Set())}if(e.hasInv){r.stok+=e.stok;sk.get(e.cab).add(e.kode)}r.sales+=pos(e.sq)});var a=Array.from(m.values());a.forEach(function(r){r.sku=sk.get(r.cab).size});return a}

/* ================= render utama ================= */
function renderChips(){
  $('#chips').innerHTML='<span class="chip">Periode jual <b>'+esc(fmtDate(M.from))+' – '+esc(fmtDate(M.to))+'</b></span><span class="chip">Umur stok per <b>'+esc(fmtDate(M.asof))+'</b></span>'+(isSample?'<span class="chip">Data contoh</span>':'');
}
function renderTabs(V){
  var L=null;
  $('#tabs').innerHTML=TABS.map(function(t){var badge='';if(t[0]==='deadstock'&&V.dead)badge='<span class="cnt">'+fmt(V.dead)+'</span>';
    return '<button class="tab" role="tab" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+badge+'</button>'}).join('');
}
function renderAll(){
  if(!M)return;
  var V=computeScope(),h='';
  renderChips();renderTabs(V);
  if(!M.IB.length){tab='data'}
  if(tab==='ringkasan')h=renderRingkasan(V);else if(tab==='deadstock')h=renderDead(V);else if(tab==='movement')h=renderMove(V);else if(tab==='supplier')h=renderSupplier();else h=renderData();
  var host=$('#view'),sy=window.scrollY;host.innerHTML=h;
  Object.keys(TBL).forEach(function(id){if($('#t-'+id))drawTable(id)});
  window.scrollTo(0,sy);
}
function setTab(t,sub){tab=t;if(sub)deadSub=sub;try{history.replaceState(null,'','#'+t)}catch(e){}renderAll();window.scrollTo(0,0)}

/* ================= event ================= */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-tab],[data-sort],[data-more],[data-copy],[data-go],[data-sub],[data-cls],[data-pick],tr.clk');if(!el)return;
  if(el.dataset.tab)return setTab(el.dataset.tab);
  if(el.dataset.go)return setTab(el.dataset.go,el.dataset.sub);
  if(el.dataset.pick)return $('#file').click();
  if(el.dataset.sub){deadSub=el.dataset.sub;return renderAll()}
  if(el.dataset.cls){clsF=clsF===el.dataset.cls?'':el.dataset.cls;return renderAll()}
  if(el.dataset.sort){var t=TBL[el.dataset.t],k=el.dataset.sort;t.sort=t.sort&&t.sort.k===k?{k:k,dir:-t.sort.dir}:{k:k,dir:(t.cols.filter(function(c){return c.k===k})[0].n?-1:1)};return drawTable(el.dataset.t)}
  if(el.dataset.more){TBL[el.dataset.more].lim+=200;return drawTable(el.dataset.more)}
  if(el.dataset.copy)return copyTable(el.dataset.copy);
  if(el.matches('tr.clk')){var tt=TBL[el.dataset.t];var row=tt.view[+el.dataset.i];if(row&&tt.onRow)tt.onRow(row)}
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.q){var tb=TBL[t.dataset.q];tb.q=t.value;tb.lim=100;drawTable(t.dataset.q);return}
  var map={sFast:'fast',sSlow:'slow',sSt:'st',sGood:'good',sMid:'mid'};
  if(map[t.id]){var v=parseFloat(t.value);if(v>0){S[map[t.id]]=v;lsSet('dse_settings',S);clearTimeout(input.h);input.h=setTimeout(function(){var id=t.id,pos=t.selectionStart;renderAll();var n=$('#'+id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}},350)}}
});
function input(){}
$('#fCab').addEventListener('change',function(e){F.cab=e.target.value;renderAll()});
$('#fSup').addEventListener('change',function(e){F.sup=e.target.value;renderAll()});
$('#bReset').addEventListener('click',function(){F.cab='';F.sup='';clsF='';$('#fCab').value='';$('#fSup').value='';renderAll()});
$('#bLoad').addEventListener('click',function(){$('#file').click()});
$('#file').addEventListener('change',function(e){var f=Array.from(e.target.files);e.target.value='';if(f.length)ingest(f)});
['dragover','dragenter'].forEach(function(n){document.addEventListener(n,function(e){if(e.dataTransfer&&Array.from(e.dataTransfer.types||[]).indexOf('Files')>=0){e.preventDefault();var d=$('#drop');if(d)d.classList.add('over')}})});
['dragleave','drop'].forEach(function(n){document.addEventListener(n,function(e){var d=$('#drop');if(d)d.classList.remove('over');if(n==='drop'&&e.dataTransfer&&e.dataTransfer.files.length){e.preventDefault();ingest(Array.from(e.dataTransfer.files).filter(function(f){return /\.xlsx?$/i.test(f.name)}))}})});
window.addEventListener('hashchange',function(){var t=(location.hash||'#ringkasan').slice(1);if(t!==tab&&TABS.some(function(x){return x[0]===t})){tab=t;renderAll()}});
// tooltip
var tip=$('#tip');
document.addEventListener('mousemove',function(e){var el=e.target.closest&&e.target.closest('[data-tip]');if(!el){tip.style.display='none';return}
  tip.textContent=el.getAttribute('data-tip');tip.style.display='block';var x=e.clientX+14,y=e.clientY+14,w=tip.offsetWidth,h=tip.offsetHeight;
  if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=Math.max(4,x)+'px';tip.style.top=Math.max(4,y)+'px'});
document.addEventListener('mouseleave',function(){tip.style.display='none'});

/* ================= mulai ================= */
store=decodeSeed(JSON.parse($('#seed').textContent));
rebuild();renderAll();
window.__dse={parseSheet:parseSheet,get M(){return M},get store(){return store},ingest:ingest,F:F,S:S,computeScope:computeScope,perSupplier:perSupplier,perItem:perItem,deadLists:deadLists};
})();
